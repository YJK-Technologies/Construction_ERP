name: Construction_ERP Auto Deploy (IIS + NSSM)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # -------------------------------------------------
      # 1️⃣ Enable Windows Long Paths
      # -------------------------------------------------
      - name: Enable Git Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      # -------------------------------------------------
      # 2️⃣ Capture Job Start Time
      # -------------------------------------------------
      - name: Capture Job Start Time
        shell: powershell
        run: |
          $log = "D:\Action-Runners\construction-runner\_diag\job-runtime-IST.log"

          "START | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | Repo=$env:GITHUB_REPOSITORY | RunId=$env:GITHUB_RUN_ID" |
          Out-File -Append $log

      # -------------------------------------------------
      # 3️⃣ Checkout Repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # -------------------------------------------------
      # 4️⃣ Setup Node.js
      # -------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------------------------------
      # 5️⃣ Sync Backend to IIS
      # -------------------------------------------------
      - name: Sync backend to IIS
        shell: powershell
        run: |
          $src = "$env:GITHUB_WORKSPACE\backend"
          $dest = "C:\inetpub\wwwroot\Construction_ERP\server"

          if (!(Test-Path $src)) {
            Write-Error "Backend folder not found: $src"
            exit 1
          }

          Write-Host "Syncing backend files..."

          robocopy $src $dest /MIR /XD node_modules .git

          $code = $LASTEXITCODE

          Write-Host "Robocopy Exit Code: $code"

          # SUCCESS CODES
          if ($code -le 7) {
            Write-Host "Backend sync successful."
            exit 0
          }
          else {
            Write-Error "Backend sync failed."
            exit $code
          }

      # -------------------------------------------------
      # 6️⃣ Install Backend Dependencies
      # -------------------------------------------------
      - name: Install backend dependencies
        shell: powershell
        run: |
          cd C:\inetpub\wwwroot\Construction_ERP\server

          Write-Host "Installing backend packages..."

          npm ci --legacy-peer-deps

      # -------------------------------------------------
      # 7️⃣ Restart Backend Service (NSSM)
      # -------------------------------------------------
      - name: Restart backend service
        shell: powershell
        run: |
          $serviceName = "Construction_ERP"

          $nssm = "C:\Windows\System32\nssm.exe"

          $node = "C:\Program Files\nodejs\node.exe"

          $app = "C:\inetpub\wwwroot\Construction_ERP\server\https.js"

          $appDir = "C:\inetpub\wwwroot\Construction_ERP\server"

          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {

              Write-Host "Restarting existing service..."

              Restart-Service $serviceName -Force

              Start-Sleep -Seconds 5

              Write-Host "Service restarted successfully."

          }
          else {

              Write-Host "Creating NSSM service..."

              & $nssm install $serviceName $node $app

              & $nssm set $serviceName AppDirectory $appDir

              & $nssm set $serviceName Start SERVICE_AUTO_START

              & $nssm set $serviceName AppStdout "$appDir\nssm-out.log"

              & $nssm set $serviceName AppStderr "$appDir\nssm-err.log"

              & $nssm start $serviceName

              Write-Host "Service created successfully."
          }

      # -------------------------------------------------
      # 8️⃣ Install Frontend Dependencies
      # -------------------------------------------------
      - name: Install frontend dependencies
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE

          Write-Host "Installing frontend packages..."

          npm ci --legacy-peer-deps

      # -------------------------------------------------
      # 9️⃣ Build Frontend
      # -------------------------------------------------
      - name: Build frontend
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE

          $env:CI = "false"
          $env:GENERATE_SOURCEMAP = "false"

          Write-Host "Building frontend..."

          npm run build

      # -------------------------------------------------
      # 🔟 Deploy Frontend to IIS
      # -------------------------------------------------
      - name: Deploy frontend to IIS
        shell: powershell
        run: |
          $src = "$env:GITHUB_WORKSPACE\build"
          $dest = "C:\inetpub\wwwroot\Construction_ERP\build"

          if (!(Test-Path $src)) {
            Write-Error "Frontend build folder not found."
            exit 1
          }

          Write-Host "Deploying frontend build..."

          robocopy $src $dest /MIR /XF web.config

          $code = $LASTEXITCODE

          Write-Host "Robocopy Exit Code: $code"

          # SUCCESS CODES
          if ($code -le 7) {
            Write-Host "Frontend deployment successful."
            exit 0
          }
          else {
            Write-Error "Frontend deployment failed."
            exit $code
          }

      # -------------------------------------------------
      # 1️⃣1️⃣ Capture Job End Time
      # -------------------------------------------------
      - name: Capture Job End Time
        if: always()
        shell: powershell
        run: |
          $log = "D:\Action-Runners\construction-runner\_diag\job-runtime-IST.log"

          "END | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | Repo=$env:GITHUB_REPOSITORY | RunId=$env:GITHUB_RUN_ID | Status=${{ job.status }}" |
          Out-File -Append $log
