name: Construction_ERP Auto Deploy (IIS + NSSM)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # -------------------------------------------------
      # 1️⃣ CHECKOUT REPOSITORY
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # -------------------------------------------------
      # 2️⃣ ENABLE WINDOWS LONG PATHS
      # -------------------------------------------------
      - name: Enable Git Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      # -------------------------------------------------
      # 3️⃣ CAPTURE JOB START TIME
      # -------------------------------------------------
      - name: Capture Job Start Time
        shell: powershell
        run: |
          $log = "D:\Action-Runners\construction-runner\_diag\job-runtime-IST.log"

          "START | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | Repo=$env:GITHUB_REPOSITORY | RunId=$env:GITHUB_RUN_ID" |
          Out-File -Append $log

      # -------------------------------------------------
      # 4️⃣ SETUP NODE
      # -------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------------------------------
      # 5️⃣ BACKEND DEPLOY
      # -------------------------------------------------
      - name: Sync backend to IIS
        shell: powershell
        run: |
          $src = "$env:GITHUB_WORKSPACE\backend"
          $dest = "C:\inetpub\wwwroot\Construction_ERP\server"

          if (!(Test-Path $src)) {
            Write-Error "Backend folder not found."
            exit 1
          }

          robocopy $src $dest /MIR /XD node_modules .git

          if ($LASTEXITCODE -gt 7) {
            exit $LASTEXITCODE
          }

      # -------------------------------------------------
      # 6️⃣ INSTALL BACKEND PACKAGES
      # -------------------------------------------------
      - name: Install backend dependencies
        shell: powershell
        run: |
          cd C:\inetpub\wwwroot\Construction_ERP\server

          npm ci --legacy-peer-deps

      # -------------------------------------------------
      # 7️⃣ RESTART BACKEND (NSSM)
      # -------------------------------------------------
      - name: Restart backend service
        shell: powershell
        run: |
          $service = "Construction_ERP"

          if (Get-Service -Name $service -ErrorAction SilentlyContinue) {

            Restart-Service $service -Force

            Write-Host "Service restarted."

          } else {

            $nssm = "C:\Windows\System32\nssm.exe"

            $node = "C:\Program Files\nodejs\node.exe"

            $app = "C:\inetpub\wwwroot\Construction_ERP\server\https.js"

            $dir = "C:\inetpub\wwwroot\Construction_ERP\server"

            & $nssm install $service $node $app

            & $nssm set $service AppDirectory $dir

            & $nssm set $service Start SERVICE_AUTO_START

            & $nssm start $service
          }

      # -------------------------------------------------
      # 8️⃣ INSTALL FRONTEND PACKAGES
      # -------------------------------------------------
      - name: Install frontend dependencies
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE

          npm ci --legacy-peer-deps

      # -------------------------------------------------
      # 9️⃣ BUILD FRONTEND
      # -------------------------------------------------
      - name: Build frontend
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE

          $env:CI = "false"
          $env:GENERATE_SOURCEMAP = "false"

          npm run build

      # -------------------------------------------------
      # 🔟 DEPLOY FRONTEND
      # -------------------------------------------------
      - name: Deploy frontend to IIS
        shell: powershell
        run: |
          $src = "$env:GITHUB_WORKSPACE\build"

          $dest = "C:\inetpub\wwwroot\Construction_ERP\build"

          robocopy $src $dest /MIR /XF web.config

          if ($LASTEXITCODE -gt 7) {
            exit $LASTEXITCODE
          }

      # -------------------------------------------------
      # 1️⃣1️⃣ CAPTURE JOB END TIME
      # -------------------------------------------------
      - name: Capture Job End Time
        if: always()
        shell: powershell
        run: |
          $log = "D:\Action-Runners\construction-runner\_diag\job-runtime-IST.log"

          "END | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | Repo=$env:GITHUB_REPOSITORY | RunId=$env:GITHUB_RUN_ID | Status=${{ job.status }}" |
          Out-File -Append $log
