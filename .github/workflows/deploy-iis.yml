name: Construction_ERP Auto Deploy (IIS + NSSM)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # -------------------------------------------------
      # 0️⃣ ENABLE WINDOWS LONG PATH SUPPORT
      # -------------------------------------------------
      - name: Enable Git Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      # -------------------------------------------------
      # 1️⃣ CLEAN OLD WORKSPACE (ROBUST WINDOWS SAFE)
      # -------------------------------------------------
      - name: Clean runner workspace
        shell: powershell
        run: |
          Write-Host "Cleaning old workspace..."

          $workspace = $env:GITHUB_WORKSPACE
          $emptyDir = "D:\empty-folder"

          # Create reusable empty folder
          if (!(Test-Path $emptyDir)) {
            New-Item -ItemType Directory -Path $emptyDir | Out-Null
          }

          if (Test-Path $workspace) {

            Write-Host "Removing old files using robocopy mirror..."

            # Mirror empty directory into workspace
            robocopy $emptyDir $workspace /MIR /R:1 /W:1

            # Robocopy success codes are <= 7
            if ($LASTEXITCODE -gt 7) {
              Write-Error "Workspace cleanup failed with Robocopy exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }

            # Remove remaining hidden/system items safely
            Get-ChildItem $workspace -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

            Write-Host "Workspace cleaned successfully."
          }

      # -------------------------------------------------
      # 2️⃣ Capture JOB START TIME
      # -------------------------------------------------
      - name: Capture Job Start Time (IST)
        shell: powershell
        run: |
          $ist = Get-Date
          $log = "D:\Action-Runners\construction-runner\_diag\job-runtime-IST.log"

          "START | $($ist.ToString('yyyy-MM-dd HH:mm:ss')) | Repo=$env:GITHUB_REPOSITORY | RunId=$env:GITHUB_RUN_ID" |
          Out-File -Append $log

      # -------------------------------------------------
      # 3️⃣ Checkout Repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      # -------------------------------------------------
      # 4️⃣ Setup Node.js
      # -------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------------------------------
      # 5️⃣ Sync BACKEND code to IIS
      # -------------------------------------------------
      - name: Sync backend code to IIS
        shell: powershell
        run: |
          $src = "$env:GITHUB_WORKSPACE\backend"
          $dest = "C:\inetpub\wwwroot\Construction_ERP\server"

          if (!(Test-Path $src)) {
            Write-Error "Backend source folder not found: $src"
            exit 1
          }

          Write-Host "Syncing backend files..."

          robocopy $src $dest /MIR /XD node_modules .git

          if ($LASTEXITCODE -le 7) {
            Write-Host "Backend sync completed successfully."
            exit 0
          }
          else {
            Write-Error "Robocopy backend sync failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # -------------------------------------------------
      # 6️⃣ Install Backend Dependencies
      # -------------------------------------------------
      - name: Install backend dependencies
        shell: powershell
        run: |
          $backendPath = "C:\inetpub\wwwroot\Construction_ERP\server"

          cd $backendPath

          Write-Host "Cleaning backend node_modules..."

          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Installing backend packages..."

          npm ci --legacy-peer-deps

      # -------------------------------------------------
      # 7️⃣ Restart Backend using NSSM
      # -------------------------------------------------
      - name: Restart backend (NSSM)
        shell: powershell
        run: |
          $serviceName = "Construction_ERP"

          $nssm = "C:\Windows\System32\nssm.exe"

          $node = "C:\Program Files\nodejs\node.exe"

          $app = "C:\inetpub\wwwroot\Construction_ERP\server\https.js"

          $appDir = "C:\inetpub\wwwroot\Construction_ERP\server"

          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {

              Write-Host "Service exists. Restarting..."

              & $nssm restart $serviceName
          }
          else {

              Write-Host "Creating NSSM service..."

              & $nssm install $serviceName $node $app

              & $nssm set $serviceName AppDirectory $appDir

              & $nssm set $serviceName Start SERVICE_AUTO_START

              & $nssm set $serviceName AppStdout "$appDir\nssm-out.log"

              & $nssm set $serviceName AppStderr "$appDir\nssm-err.log"

              & $nssm start $serviceName
          }

      # -------------------------------------------------
      # 8️⃣ Install Frontend Dependencies
      # -------------------------------------------------
      - name: Install frontend dependencies
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE

          Write-Host "Cleaning frontend node_modules..."

          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Installing frontend packages..."

          npm ci --legacy-peer-deps

      # -------------------------------------------------
      # 9️⃣ Build Frontend
      # -------------------------------------------------
      - name: Build frontend
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE

          $env:CI = "false"
          $env:GENERATE_SOURCEMAP = "false"

          Write-Host "Building frontend..."

          npm run build

      # -------------------------------------------------
      # 🔟 Deploy Frontend to IIS
      # -------------------------------------------------
      - name: Deploy frontend to IIS
        shell: powershell
        run: |
          $buildSrc = "$env:GITHUB_WORKSPACE\build"

          $buildDest = "C:\inetpub\wwwroot\Construction_ERP\build"

          if (!(Test-Path $buildSrc)) {
            Write-Error "Build folder not found."
            exit 1
          }

          Write-Host "Deploying frontend build..."

          robocopy $buildSrc $buildDest /MIR /XF web.config

          if ($LASTEXITCODE -le 7) {
            Write-Host "Frontend deployment completed."
            exit 0
          }
          else {
            Write-Error "Frontend deployment failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # -------------------------------------------------
      # 1️⃣1️⃣ Capture JOB END TIME
      # -------------------------------------------------
      - name: Capture Job End Time (IST)
        if: always()
        shell: powershell
        run: |
          $ist = Get-Date

          $log = "D:\Action-Runners\construction-runner\_diag\job-runtime-IST.log"

          "END | $($ist.ToString('yyyy-MM-dd HH:mm:ss')) | Repo=$env:GITHUB_REPOSITORY | RunId=$env:GITHUB_RUN_ID | Status=${{ job.status }}" |
          Out-File -Append $log
